<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lembra Aí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EE; --card:#FFFFFF; --ink:#1F1A14; --muted:#7D7368; --line:#EDE4D6;
  --accent:#FF5A1F; --accent-ink:#FFFFFF; --accent-soft:#FFE9DE;
  --late:#D62839; --late-soft:#FDE5E8; --ok:#1F9D74; --star:#F2A900;
  --shadow:0 1px 2px rgba(31,26,20,.05),0 6px 20px rgba(31,26,20,.06);
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#15120E; --card:#211D17; --ink:#F4EEE5; --muted:#A79D90; --line:#342E25;
    --accent-soft:#3B2216; --late-soft:#3A181D; --shadow:0 0 0 1px #2B261F; }
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"DM Sans",system-ui,sans-serif;font-size:16px;line-height:1.4;
  padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 40px)}
.wrap{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}

/* header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:34px;letter-spacing:-.02em;margin:0;line-height:1}
h1 span{color:var(--accent)}
.today{color:var(--muted);font-size:14px;margin-top:6px}
.today::first-letter{text-transform:uppercase}
.badge{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;padding:7px 11px;border-radius:999px;white-space:nowrap}
.badge.zero{background:transparent;color:var(--muted);border:1px solid var(--line)}

/* composer */
.composer{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:18px;font-weight:500;min-height:52px;padding:2px}
.composer textarea::placeholder{color:var(--muted);font-weight:400}
.composer.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:transparent;font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input.chip{min-width:0;max-width:150px}
input.chip::-webkit-calendar-picker-indicator{opacity:.6}
.cats{display:flex;gap:8px;overflow-x:auto;margin:10px -14px 0;padding:0 14px 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat.on{background:var(--c);border-color:var(--c);color:#fff}
.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.ai{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);user-select:none}
.ai input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:.2s;margin:0;flex:none}
.ai input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.ai input:checked{background:var(--accent)}
.ai input:checked::after{left:19px}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;height:44px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.primary:disabled{opacity:.6}
.ghost{height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;font-size:15px}
.danger{color:var(--late);font-weight:600;height:44px;padding:0 6px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:2px 16px 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}

/* list */
.group{margin-top:18px}
.group h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 4px 8px;display:flex;justify-content:space-between;align-items:center}
.group.atrasado h2{color:var(--late)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:13px 14px;cursor:pointer;position:relative;transition:transform .15s,opacity .3s}
.item:active{transform:scale(.985)}
.group.atrasado .item{box-shadow:inset 3px 0 0 var(--late),var(--shadow)}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);margin-top:-1px;display:grid;place-items:center;transition:.2s}
.check:hover{border-color:var(--ok)}
.check svg{width:14px;height:14px;opacity:0;transition:.2s}
.item.done .check,.item.popping .check{background:var(--ok);border-color:var(--ok)}
.item.done .check svg,.item.popping .check svg{opacity:1}
.item.popping{opacity:.4}
.body{flex:1;min-width:0}
.title{font-weight:500;word-wrap:break-word}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:5px;font-size:13px;color:var(--muted);align-items:center}
.meta .when.late{color:var(--late);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.staricon{color:var(--star);flex:none;font-size:16px}
.note-ico{opacity:.7}
.empty{text-align:center;color:var(--muted);padding:44px 20px}
.empty b{display:block;font-size:40px;margin-bottom:8px}
.linkbtn{color:var(--muted);font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;text-decoration:underline;text-underline-offset:3px}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
.foot p{margin:4px 0}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,15,10,.45);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--card);border-radius:22px 22px 0 0;
  padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:21;max-height:92vh;overflow:auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:transparent;resize:none;outline:0}
.sheet textarea:focus,.sheet input:focus{border-color:var(--accent)}
#eTitle{font-size:18px;font-weight:600}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.frow label{font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px}
.frow input{height:42px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:transparent;outline:0;width:100%}
.sheet .cats{margin:0 -16px 12px;padding:0 16px 2px}
#eNote{margin-top:2px}
.starrow{display:flex;align-items:center;justify-content:space-between;margin:12px 2px}
.sheet-actions{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.sheet-actions .right{display:flex;gap:8px}

/* toast + alarm */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);
  padding:11px 16px;border-radius:999px;font-size:14px;font-weight:600;transition:.25s;z-index:40;display:flex;gap:12px;align-items:center;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast button{color:var(--accent);font-weight:700}
.alarm{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 12px);max-width:536px;margin:0 auto;background:var(--accent);color:#fff;border-radius:18px;
  padding:14px;z-index:30;box-shadow:0 10px 30px rgba(255,90,31,.35);transform:translateY(-140%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.alarm.show{transform:none;animation:ring 1s ease 2}
@keyframes ring{10%,30%{transform:rotate(-1.5deg)}20%,40%{transform:rotate(1.5deg)}50%{transform:none}}
.alarm small{opacity:.85;font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.alarm .at{font-size:18px;font-weight:700;margin:2px 0 10px}
.alarm .row{display:flex;gap:8px}
.alarm button{background:rgba(255,255,255,.2);color:#fff;font-weight:700;height:38px;padding:0 14px;border-radius:999px}
.alarm button.w{background:#fff;color:var(--accent)}
.warn{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--late-soft);color:var(--late);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:600}
.warn button{background:var(--late);color:#fff;border-radius:999px;height:34px;padding:0 14px;font-weight:700;flex:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Lembra <span>Aí</span></h1>
      <div class="today" id="todayLbl"></div>
    </div>
    <div class="badge zero" id="badge">—</div>
  </header>

  <section class="composer" id="composer">
    <textarea id="txt" rows="2" enterkeyhint="done" placeholder="O que você não pode esquecer?"></textarea>
    <div class="opts">
      <button class="chip" data-day="0" type="button">Hoje</button>
      <button class="chip" data-day="1" type="button">Amanhã</button>
      <input class="chip" type="date" id="fDate" aria-label="Dia">
      <input class="chip" type="time" id="fTime" aria-label="Hora">
    </div>
    <div class="cats" id="fCats"></div>
    <div class="actions">
      <label class="ai" id="aiWrap"><input type="checkbox" id="aiOn" checked> ✨ Entender data e hora sozinho</label>
      <span></span>
      <button class="primary" id="btnAdd" type="button">Salvar</button>
    </div>
  </section>

  <div class="warn" id="warn" hidden><span id="warnTxt"></span><button id="warnBtn" type="button">Ativar</button></div>
  <nav class="filters" id="filters"></nav>
  <div id="list"><div class="empty">Carregando…</div></div>

  <div class="foot">
    <p>Escreva do seu jeito: <i>"pagar a luz amanhã às 9h"</i>, <i>"ligar pro cliente sexta 15h"</i>, <i>"tirar o bolo daqui a 40 min"</i>.</p>
    <p><button class="linkbtn" id="btnTest" type="button">🔔 Testar notificação</button></p>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Editar lembrete">
  <div class="grab"></div>
  <textarea id="eTitle" rows="2" placeholder="Lembrete"></textarea>
  <div class="frow">
    <label>Dia<input type="date" id="eDate"></label>
    <label>Hora<input type="time" id="eTime"></label>
  </div>
  <div class="cats" id="eCats"></div>
  <textarea id="eNote" rows="3" placeholder="Detalhes (opcional)"></textarea>
  <div class="starrow">
    <span>⭐ Importante</span>
    <label class="ai" style="color:inherit"><input type="checkbox" id="eStar"></label>
  </div>
  <div class="sheet-actions">
    <button class="danger" id="eDel" type="button">Excluir</button>
    <div class="right">
      <button class="primary" id="eSave" type="button">Salvar</button>
    </div>
  </div>
</div>

<div class="alarm" id="alarm" role="alert">
  <small>⏰ Tá na hora</small>
  <div class="at" id="alarmTxt"></div>
  <div class="row">
    <button class="w" id="alarmDone" type="button">Feito ✓</button>
    <button id="alarmSnooze" type="button">+10 min</button>
    <button id="alarmClose" type="button">Fechar</button>
  </div>
</div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn" type="button" hidden></button></div>

<script src="native.js"></script>
<script src="app.js"></script>
</body>
</html>
